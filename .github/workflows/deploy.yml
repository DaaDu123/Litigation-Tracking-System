name: CI/CD - LTS

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Get latest source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Restore Backend dependencies
      - name: Restore Backend
        run: dotnet restore LTSBackend/LTSBackend.csproj

      # 4. Build Backend - checks C# compile errors
      - name: Build Backend
        run: dotnet build LTSBackend/LTSBackend.csproj --configuration Release --no-restore

      # 5. Restore Frontend dependencies
      - name: Restore Frontend
        run: dotnet restore LTSFrontend/LTSFrontend.csproj

      # 6. Build Frontend - checks C# compile errors
      - name: Build Frontend
        run: dotnet build LTSFrontend/LTSFrontend.csproj --configuration Release --no-restore

      # 7. Build Backend Docker image
      - name: Build Backend Docker image
        run: docker build -t lts-backend-ci ./LTSBackend

      # 8. Build Frontend Docker image
      - name: Build Frontend Docker image
        run: docker build -t lts-frontend-ci ./LTSFrontend

      # 9. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            cd /home/ubuntu/Litigation-Tracking-System

            echo "======================================"
            echo "Pulling latest code from GitHub..."
            echo "======================================"

            git pull --ff-only origin master

            echo "======================================"
            echo "Building Docker images..."
            echo "======================================"

            docker compose build backend frontend migrations

            echo "======================================"
            echo "Starting SQL Server..."
            echo "======================================"

            docker compose up -d db

            echo "======================================"
            echo "Running EF Core production migrations..."
            echo "======================================"

            docker compose run --rm migrations

            echo "======================================"
            echo "Migrations completed successfully!"
            echo "Starting Backend and Frontend..."
            echo "======================================"

            docker compose up -d backend frontend

            echo "======================================"
            echo "Checking containers..."
            echo "======================================"

            docker compose ps

            echo "======================================"
            echo "Deployment completed successfully!"
            echo "======================================"
