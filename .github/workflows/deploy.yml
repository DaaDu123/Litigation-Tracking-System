name: CI/CD - LTS

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub repository ka code lena
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. .NET setup
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Backend restore
      - name: Restore Backend
        run: dotnet restore LTSBackend/LTSBackend.csproj

      # 4. Backend build check
      - name: Build Backend
        run: dotnet build LTSBackend/LTSBackend.csproj --configuration Release --no-restore

      # 5. Frontend restore
      - name: Restore Frontend
        run: dotnet restore LTSFrontend/LTSFrontend.csproj

      # 6. Frontend build check
      - name: Build Frontend
        run: dotnet build LTSFrontend/LTSFrontend.csproj --configuration Release --no-restore

      # 7. Docker images build check
      - name: Build Docker images
        run: docker compose build backend frontend

      # 8. Agar upar ke tamam checks successful hain,
      #    tab EC2 par deployment hoga
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/Litigation-Tracking-System

            echo "Pulling latest code..."
            git pull origin master

            echo "Deploying Backend and Frontend..."
            docker compose up -d --build backend frontend

            echo "Checking containers..."
            docker compose ps

            echo "Deployment completed successfully!"
